[package]
name = "tezbar-unicode-symbols-process"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0 AND Unicode-3.0 AND Unicode-DFS-2016 AND BSD-3-Clause AND CC-BY-4.0"
repository = "https://github.com/almatkai/unicode-symbols"
description = "Standalone Tezbar Unicode Symbols process extension"

[[bin]]
name = "tezbar-unicode-symbols"
path = "native/main.rs"

[workspace]
members = ["v2"]
resolver = "2"

[dependencies]
engine = { package = "tezbar-unicode-symbols", path = "v2" }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "fs"] }
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "aaec571673ab64a85a136cf6bd054ef660c4d93c" }

[dev-dependencies]
tempfile = "=3.14.0"
